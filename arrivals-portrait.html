<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YHZ ARRIVALS | Portrait Flight Board</title>

<style>
:root{
    color-scheme:dark;
    --bg:#07101e;
    --panel:#111d30;
    --line:#27364d;
    --muted:#a9bdd2;
    --green:#5ce6a4;
    --blue:#67c7ff;
    --amber:#ffd16e;
    --red:#ff8585;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:#f6f9ff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
}

/* ---------- TOP HEADER ---------- */

header{
    background:#101c2d;
    border-bottom:2px solid var(--line);
    padding:1.1vh 2.4vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1vw;
    flex-shrink:0;
}

.brand{
    font-weight:800;
    font-size:clamp(24px,3.5vw,52px);
    letter-spacing:.035em;
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:.42em;
    margin-top:.25vh;
    letter-spacing:.1em;
}

.clock{
    font-weight:800;
    font-size:clamp(22px,3.2vw,46px);
    white-space:nowrap;
    text-align:right;
}

.clock small{
    display:block;
    font-size:.42em;
    color:var(--muted);
    font-weight:400;
    margin-top:.25vh;
}

/* ---------- BOARD ---------- */

main{
    padding:.8vh 1.3vw;
    flex:1;
    min-height:0;
    display:flex;
}

.board{
    flex:1;
    min-height:0;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1b2a40;
    padding:.8vh 1.7vw;
    flex-shrink:0;
}

.heading h1{
    font-size:clamp(30px,4.6vw,66px);
    color:var(--green);
    margin:0;
}

.page{
    font-size:clamp(16px,2.1vw,30px);
    color:var(--muted);
    font-weight:bold;
}

/* ---------- COLUMNS ---------- */

.cols,
.flight{
    display:grid;
    grid-template-columns:
        1.05fr
        1.75fr
        .95fr
        .95fr
        .55fr
        1.15fr;
    gap:.45vw;
    align-items:center;
    padding:0 1.2vw;
}

.cols{
    height:3.6vh;
    flex-shrink:0;
    background:#142136;
    color:var(--muted);
    font-size:clamp(14px,1.65vw,25px);
    font-weight:bold;
}

/* ---------- FLIGHTS ---------- */

.flights{
    flex:1;
    min-height:0;
    display:grid;

    /* 22 FLIGHTS ON EACH PAGE */
    grid-template-rows:repeat(22,minmax(0,1fr));
}

.flight{
    min-height:0;
    border-top:1px solid var(--line);

    /*
       Larger text than the old board,
       while fitting 22 rows.
    */
    font-size:clamp(17px,2.15vw,32px);
    line-height:1;
}

.flight:nth-child(even){
    background:#17253a;
}

.flight strong{
    font-size:1.08em;
}

.place{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.status{
    font-size:.88em;
    font-weight:800;
    white-space:nowrap;
}

.on-time,
.arrived,
.landed{
    color:var(--green);
}

.early,
.boarding{
    color:var(--blue);
}

.delayed,
.late{
    color:var(--amber);
}

.cancelled{
    color:var(--red);
}

.empty{
    grid-row:1/-1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--muted);
    font-size:3vw;
}

/* ---------- FOOTER ---------- */

footer{
    flex-shrink:0;
    padding:.65vh 2vw;
    display:flex;
    justify-content:space-between;
    gap:2vw;
    align-items:center;
    border-top:2px solid var(--line);
    font-size:clamp(14px,1.6vw,24px);
    color:var(--muted);
}

.good{color:var(--green)}
.warning{color:var(--amber)}
.bad{color:var(--red)}

</style>
</head>

<body>

<header>

<div class="brand">
HALIFAX STANFIELD
<span style="color:#67c7ff">YHZ</span>

<small>
FLIGHT INFORMATION
</small>
</div>

<div class="clock">
<span id="time">--:--</span>
<small>ATLANTIC TIME</small>
</div>

</header>

<main>

<section class="board">

<div class="heading">

<h1>✈ ARRIVALS</h1>

<span
class="page"
id="page">
</span>

</div>

<div class="cols">

<span>FLIGHT</span>
<span>FROM</span>
<span>EXPECTED</span>
<span>ACTUAL</span>
<span>GATE</span>
<span>STATUS</span>

</div>

<div
class="flights"
id="flights">

<div class="empty">
Loading flights...
</div>

</div>

</section>

</main>

<footer>

<span id="updated">
Checking flight information...
</span>

<span id="health">
Connecting...
</span>

</footer>

<script>

'use strict';

const DIRECTION='arrivals';

const DATA_URL=
'https://raw.githubusercontent.com/mainline123/YHZ-Flight-Board/main/flights.json';


/*
   22 flights per page.
   With roughly 50 flights this should
   reduce the board from 6 pages to
   approximately 3 pages.
*/

const PER_PAGE=22;


/*
   Each page remains on screen
   for 12 seconds.
*/

const ROTATE_MS=12000;


/*
   Check GitHub for updated
   flight information every minute.
*/

const REFRESH_MS=60000;


/*
   Data must now be more than
   THREE HOURS old before the
   DATA OUTDATED warning appears.
*/

const STALE_MS=3*60*60*1000;


let data=null;
let page=0;
let fetchError=false;


const el=id=>
document.getElementById(id);


function escapeHTML(x){

return String(x??'—')
.replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);

}


function statusClass(x){

const s=
String(x||'').toLowerCase();

if(s.includes('cancel'))
return'cancelled';

if(s.includes('delay'))
return'delayed';

if(s.includes('late'))
return'late';

if(s.includes('early'))
return'early';

if(s.includes('boarding'))
return'boarding';

if(s.includes('arriv'))
return'arrived';

if(s.includes('land'))
return'landed';

if(s.includes('on time'))
return'on-time';

return'';

}


function clock(){

el('time').textContent=
new Date().toLocaleTimeString(
'en-CA',
{
timeZone:'America/Halifax',
hour:'2-digit',
minute:'2-digit',
hour12:true
}
);

}


function health(){

if(!data){

el('health').className='bad';

el('health').textContent=
'Flight data unavailable';

return;

}


const d=
new Date(data.updated);

const age=
Date.now()-d.getTime();


if(
!Number.isFinite(age) ||
age < -300000
){

el('health').className='bad';

el('health').textContent=
'Invalid timestamp';

return;

}


el('updated').textContent=
'Updated '+
d.toLocaleString(
'en-CA',
{
timeZone:'America/Halifax',
month:'short',
day:'numeric',
hour:'numeric',
minute:'2-digit'
}
);


el('health').className=
age>STALE_MS
?'bad'
:fetchError
?'warning'
:'good';


el('health').textContent=
age>STALE_MS
?'WARNING: DATA OUTDATED'
:fetchError
?'Connection issue'
:'Data recently updated';

}


function render(){

if(!data)
return;


const flights=
data[DIRECTION]||[];


const pages=
Math.max(
1,
Math.ceil(
flights.length/PER_PAGE
)
);


const p=
page%pages;


el('page').textContent=
'PAGE '+(p+1)+' / '+pages;


const slice=
flights.slice(
p*PER_PAGE,
(p+1)*PER_PAGE
);


el('flights').innerHTML=
slice.length

?slice.map(f=>{

const place=
DIRECTION==='arrivals'
?(f.from||f.origin)
:f.destination;


return `

<div class="flight">

<strong>
${escapeHTML(f.flight)}
</strong>

<span
class="place"
title="${escapeHTML(place)}">
${escapeHTML(place)}
</span>

<span>
${escapeHTML(f.expected)}
</span>

<span>
${escapeHTML(f.actual)}
</span>

<span>
${escapeHTML(f.gate)}
</span>

<span
class="status ${statusClass(f.status)}">
${escapeHTML(f.status)}
</span>

</div>

`;

}).join('')

:'<div class="empty">No flight information available</div>';


health();

}


async function load(){

try{

const r=
await fetch(
DATA_URL+'?t='+Date.now(),
{
cache:'no-store'
}
);


if(!r.ok)
throw Error(
'HTTP '+r.status
);


const next=
await r.json();


if(
!next.updated ||
!Array.isArray(
next[DIRECTION]
)
)
throw Error(
'Invalid data'
);


data=next;
fetchError=false;

render();

}

catch(e){

console.error(e);

fetchError=true;


if(!data)

el('flights').innerHTML=
'<div class="empty">Flight data unavailable</div>';


health();

}

}


clock();

setInterval(
clock,
1000
);


load();


setInterval(
load,
REFRESH_MS
);


setInterval(
()=>{

page++;

render();

},
ROTATE_MS
);


setInterval(
health,
10000
);

</script>

</body>
</html>
