<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALIFAX STANFIELD (YHZ) - DEPARTURES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #1f2937;
        }

        header h1 {
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #38bdf8;
        }

        .clock {
            font-size: 3.2rem;
            font-weight: bold;
            color: #fbbf24;
        }

        .container {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-column {
            flex: 1;
            background: #111827;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 3px solid #1f2937;
            overflow: hidden;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 12px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #1a2234;
            color: #94a3b8;
            padding: 24px 20px;
            font-size: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 26px 20px;
            border-bottom: 1px solid #1f2937;
            font-size: 1.6rem;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-on-time {
            color: #4ade80;
            font-weight: bold;
        }

        .status-delayed {
            color: #f87171;
            font-weight: bold;
        }

        .status-cancelled {
            color: #f87171;
            font-weight: bold;
        }

        .status-boarding {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>YHZ DEPARTURES</h1>
        <div class="clock" id="clock">00:00:00 AM</div>
    </header>

    <div class="container">
        <div class="board-column">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Carrier</th>
                            <th>Flight #</th>
                            <th>Destination</th>
                            <th>Scheduled</th>
                            <th>Estimated</th>
                            <th>Gate</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="departures-body">

                        <tr>
                            <td colspan="7" style="text-align: center;">
                                Syncing...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

    <script>

        /* =========================================
           HALIFAX / YHZ LOCAL CLOCK
           Always uses America/Halifax timezone.
           Automatically handles AST and ADT.
        ========================================== */

        function updateClock() {

            const halifaxTime =
                new Date().toLocaleTimeString('en-CA', {
                    timeZone: 'America/Halifax',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });

            document.getElementById('clock').innerText = halifaxTime;
        }

        setInterval(updateClock, 1000);
        updateClock();


        /* =========================================
           LOAD FLIGHT DATA
        ========================================== */

        async function loadFlightData() {

            try {

                const response =
                    await fetch('flights.json?t=' + Date.now());

                const data =
                    await response.json();

                const departuresBody =
                    document.getElementById('departures-body');

                departuresBody.innerHTML = '';

                (data.departures || []).forEach(f => {

                    let statusClass = 'status-on-time';

                    const statusLower =
                        (f.status || '').toLowerCase();

                    if (
                        statusLower.includes('delay') ||
                        statusLower.includes('cancel')
                    ) {
                        statusClass = 'status-delayed';
                    }

                    if (statusLower.includes('boarding')) {
                        statusClass = 'status-boarding';
                    }

                    departuresBody.innerHTML += `
                        <tr>
                            <td>${f.carrier || '—'}</td>
                            <td>${f.flight || '—'}</td>
                            <td>${f.destination || '—'}</td>
                            <td>${f.expected || f.time || '—'}</td>
                            <td>${f.actual || f.time || '—'}</td>
                            <td>${f.gate || '—'}</td>
                            <td>
                                <span class="${statusClass}">
                                    ${f.status || 'On Time'}
                                </span>
                            </td>
                        </tr>
                    `;

                });

            } catch (err) {

                console.error(
                    "Error loading flight data",
                    err
                );

            }
        }

        loadFlightData();

        /* Refresh flight data every 15 seconds */
        setInterval(loadFlightData, 15000);

    </script>

</body>
</html>
