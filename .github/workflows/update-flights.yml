name: Auto-Update Flight Board

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Apify client
        run: npm install apify-client

      - name: Update YHZ flight data
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node update-flights.js

      - name: Commit and push updated flights
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Manual live YHZ flight update"
          file_pattern: flights.json last_updated.txt
