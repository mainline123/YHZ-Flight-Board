name: Auto-Update Flight Board

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Apify Fetcher
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            console.log("Connecting to Apify with stored token...");
            fs.writeFileSync("last_updated.txt", new Date().toISOString());
          '

      - name: Commit and push updated flights
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic flight board update via Apify"
          file_pattern: flights.json last_updated.txt
